name: Temporary DSC Pages deployment

on:
  workflow_dispatch:
    inputs:
      dsc_sha:
        description: Exact pushed DSC commit represented by the bundled build
        required: true
        type: string
        default: 87e4be3f961aa41498ac5e6e36cd1fe39a9afe2b

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployment artifact
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Confirm bundled build metadata
        run: test "${{ inputs.dsc_sha }}" = "87e4be3f961aa41498ac5e6e36cd1fe39a9afe2b"

      - name: Deploy DSC to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.166.0 pages deploy dsc-dist --project-name dsc-commerce-storefront --branch main
