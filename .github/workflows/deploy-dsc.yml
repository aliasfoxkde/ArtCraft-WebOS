name: Temporary DSC Pages deployment

on:
  workflow_dispatch:
    inputs:
      dsc_sha:
        description: Exact pushed DSC commit to build and deploy
        required: true
        type: string
        default: 87e4be3f961aa41498ac5e6e36cd1fe39a9afe2b

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout DSC commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: aliasfoxkde/dsc
          ref: ${{ inputs.dsc_sha }}
          path: dsc

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: dsc/pnpm-lock.yaml

      - name: Set up pnpm
        run: |
          corepack enable
          corepack prepare pnpm@9.0.0 --activate
          pnpm --version

      - name: Install dependencies
        working-directory: dsc
        run: pnpm install --frozen-lockfile

      - name: Lint
        working-directory: dsc
        run: pnpm lint

      - name: Typecheck
        working-directory: dsc
        run: pnpm --filter storefront typecheck

      - name: Build storefront
        working-directory: dsc
        env:
          VITE_SITE_URL: https://dsc-commerce-storefront.pages.dev
          VITE_API_BASE_URL: https://api.darksidecrafts.com
        run: pnpm --filter storefront build

      - name: Deploy DSC to Cloudflare Pages
        working-directory: dsc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm dlx wrangler@4.166.0 pages deploy apps/storefront/dist --project-name dsc-commerce-storefront --branch main
