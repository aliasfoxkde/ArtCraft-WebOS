name: dependency-review

on:
  pull_request_target:
    paths:
      - 'webos/package.json'
      - 'webos/package-lock.json'

permissions:
  contents: read

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # fail only on known-vulnerable or malicious versions; license
          # policy is a maintainer concern, not a bot gate
          fail-on-severity: high
          deny-licenses: AGPL-3.0, AGPL-3.0-or-later
